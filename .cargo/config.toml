[build]
target = "xtensa-esp32s3-none-elf"

[unstable]
build-std = ["core", "alloc"]

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor"
rustflags = [
    "-C", "link-arg=-Tlinkall.x",
    "-C", "link-arg=-Tdefmt.x",
    "-C", "link-arg=-Wl,--no-warn-rwx-segments",
]

[env]
# Both are defaults: an environment variable of the same name takes precedence.
DEFMT_LOG = "info"                    # firmware log filter (override: DEFMT_LOG=debug)
SERVER_CONFIG = "server_config.toml"  # config read by build.rs - make sure it's TOML (override: SERVER_CONFIG=your_path_to_server_config)