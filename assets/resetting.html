<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.ico">
<title>正在重启 · 门禁控制面板</title>
<style>
:root{
  --bg:#f2f2f7; --card:#fff; --text:#1c1c1e; --muted:#8a8a8e;
  --line:#e5e5ea; --accent:#007aff; --accent-ink:#fff;
  --ok:#34c759; --idle:#8e8e93; --warn:#ff9500; --danger:#ff3b30;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000; --card:#1c1c1e; --text:#f2f2f7; --muted:#8e8e93;
    --line:#2c2c2e; --accent:#0a84ff; --accent-ink:#fff;
    --ok:#30d158; --idle:#8e8e93; --warn:#ff9f0a; --danger:#ff453a;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100dvh; padding:24px 16px calc(24px + env(safe-area-inset-bottom));
  background:var(--bg); color:var(--text);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
       "Hiragino Sans GB","Microsoft YaHei",sans-serif;
  display:flex; justify-content:center; align-items:center;
  -webkit-font-smoothing:antialiased;
}
main{width:100%; max-width:400px; text-align:center}

.logo{display:block; width:72px; height:72px; margin:0 auto 14px; border-radius:18px}
h1{font-size:22px; font-weight:700; letter-spacing:-.02em}
.sub{margin-top:6px; font-size:14px; color:var(--muted); line-height:1.7}

.spin{
  width:28px; height:28px; margin:22px auto 0;
  border:3px solid var(--line); border-top-color:var(--accent);
  border-radius:50%; animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

footer{margin-top:22px; font-size:12px; color:var(--muted); line-height:1.7}
footer a{color:var(--accent); text-decoration:none}

/* ── 宽屏：这一页只有一列内容，放大一号就够 ── */
@media (min-width:820px){
  body{padding:40px}
  main{max-width:520px}
  .logo{width:88px; height:88px; border-radius:22px}
  h1{font-size:28px}
  .sub{font-size:15px}
  footer{font-size:13px}
}
</style>
</head>
<body>
<main>

  <img class="logo" src="/logo" alt="" width="72" height="72">
  <h1 id="title">正在重启</h1>
  <p class="sub" id="detail">固件已切换，设备将在几秒内重启。</p>
  <div class="spin" id="spin"></div>

  <footer>
    <a href="https://github.com/SCU-Maker-Org/Ayachi-door-access"
       target="_blank" rel="noopener">GitHub</a><br>
    Han_feng · 2026
  </footer>

</main>

<script>
(function () {
  'use strict';

  var titleEl = document.getElementById('title'),
      detailEl = document.getElementById('detail');

  var STEP = 800;
  var done = false;

  function setWaiting() {
    titleEl.textContent = '正在重启';
    detailEl.textContent = '设备正在重启，等待恢复响应';
  }

  /* 唯一的信号源就是 /system/activate/countdown（未鉴权、响应只是一个数字）：
       - 整条响应是数字 → 倒计时还在跑（5…1）；读到 0 就进入"等待重启"
       - 请求被重定向（r.redirected）→ 倒计时早结束了，而设备还在答话
         = 它已经回来（或压根没重启）
       - 请求失败或超时 → 设备正在重启，继续等
     收尾交给服务端：倒计时一结束它就把这条路径 303 到 /system/，所以 reload
     本页就等于"跟着那个 303 走"，落地在哪由服务端决定，这里不用知道。 */
  function poll() {
    if (done) { return; }

    fetch('/system/activate/countdown', {
      cache: 'no-store',
      signal: AbortSignal.timeout(3000),   // 设备掉线时把"挂住"变成"失败"
    })
      .then(function (r) {
        if (r.redirected) { done = true; location.reload(); return null; }
        return r.text();
      })
      .then(function (t) {
        if (t === null) { return; }              // 已经在跳转了
        // 兜底：倒计时在跑时响应必定是纯数字，拿到别的就说明它已经不在跑了
        // （比如服务端以后不再用 303 而是直接答 `/`）—— 设备能答话，就跟着回控制面板。
        var m = /^\s*(\d+)\s*$/.exec(t);
        if (!m) { done = true; location.reload(); return; }
        var n = Number(m[1]);
        if (n > 0) {
          titleEl.textContent = '正在重启 · ' + n + ' 秒';
          detailEl.textContent = '固件已切换，倒计时结束后设备重启。';
        } else {
          setWaiting();                          // 读到 0：倒计时结束，等它断电重启
        }
      })
      .catch(function () {                       // 连不上/超时 = 正在重启（正常路径）
        setWaiting();
      });
  }

  poll();
  setInterval(poll, STEP);   // 一直轮询，直到 303 把我们送回控制面板
})();
</script>
</body>
</html>
