# Made by Han_feng
#
# ============================================================================
#  Ayachi Door Access - server configuration TEMPLATE
# ============================================================================
#
#  A server config is shaped like this file - the same sections and field names -
#  and every field is explained below.
#
#  We suggest naming yours `server_config.toml` and leaving it in the crate root:
#  that is the path `.cargo/config.toml` supplies by default, so the build picks
#  it up on its own, with no extra flag to add. It is listed in .gitignore,
#  so a checkout always builds against its own copy.
#
#  Writing yours from this template, the least you have to do is fill in the
#  Wi-Fi credentials - the one section marked [] - and add at least one account.
#  `users.salt` and `users.rounds` are a decision rather than a box to fill in:
#  read their comments before settling on values.
#
#  To build against a file somewhere else instead, name it in SERVER_CONFIG.
#  Make sure that file contains TOML laid out like this template - build.rs
#  parses it without looking at the name:
#
#      SERVER_CONFIG=your_path_to_server_config cargo run --release
#
#  The config is read by `build.rs` at compile time, and everything in it ends
#  up compiled into the firmware, EXCEPT the plaintext passwords, which are
#  replaced by PBKDF2 hashes before they reach the binary.
# ============================================================================


# ---------------------------------------------------------------------------
#  Device identity
# ---------------------------------------------------------------------------

[device]
# Name reported to the DHCP server (option 12) and used as the mDNS service
# instance name. Shows up in your router's client list.
# Must be 32 bytes or fewer.
name = "AyachiServer"

# mDNS hostname. The device becomes reachable as `<hostname>.local` on the
# local network. Lowercase, no spaces, 32 bytes or fewer.
hostname = "ayachinene"

# TCP port for the web control panel. 80 keeps the URL free of a port number.
port = 80

# How many panics in a row the device tolerates before it gives up on the
# running image and returns to the factory one.
#
# Every panic - including a hardware fault, which the firmware turns into one -
# adds to a count kept in a register that survives a software reset. When the
# count reaches this number, the next boot erases the OTA boot selection, so the
# bootloader falls back to the factory slot: a device that panics on every boot
# recovers by itself instead of looping forever. 0 goes back to the factory
# image on the very first panic.
#
# The count is cleared when an update is activated. It is not cleared by an
# ordinary successful boot, so panics spread over months add up - see the
# known limitations in the README.
panic_retry = 3


# ---------------------------------------------------------------------------
#  Flash layout                                       [THE PROJECT'S FOOTPRINT]
# ---------------------------------------------------------------------------

[memory]
# These settings are the project's footprint: they decide the partition table,
# and with it how much of the module this firmware claims and how that space is
# divided. Building through `cargo run` generates that table and flashes it; a
# hand-written flash has to pass a table that agrees.
#
# How many OTA application slots the firmware should know about, not counting
# the factory image. Must match the partition table actually in flash: the
# firmware addresses slots by index (`factory`, then 0, 1, ...), and a slot this
# number promises but the table does not contain is answered with an error
# rather than silently ignored. 16 is the ceiling (the bootloader's slot
# sub-types run out there).
slots = 2

# Total size of the module's flash, in KB. 8192 is 8 MB. The cargo runner sizes
# the partition table it generates from this number: the factory image goes
# first, as large as the application image rounded up to a 64 KB block, and the
# slots share whatever is left.
flash_size = 8192

# Slots that get a fixed size and a name instead of an even share, in the order
# they should follow the factory image:
#
#     [[memory.preset]]
#     name = "spare"
#     size = 512          # KB
#
# Each entry occupies one of `slots`, so `slots` must be at least this long.
# Empty means every slot divides the space that is left.
preset = []


# ---------------------------------------------------------------------------
#  Door behaviour
# ---------------------------------------------------------------------------

[door]
# How long the lock stays released for a single "open once" action, in
# milliseconds. 3000 = three seconds, which is enough time to push the door
# open and walk through.
open_once_delay = 3000


# ---------------------------------------------------------------------------
#  Wi-Fi credentials                                        [MUST BE FILLED IN]
# ---------------------------------------------------------------------------

[wifi]
# SSID of the network to join. Case sensitive.
ssid = ""

# Password for that network.
# WPA2-PSK requires 8-63 characters.
password = ""

# How long to wait before retrying a failed association, in milliseconds.
retry_delay = 5000


# ---------------------------------------------------------------------------
#  Web server
# ---------------------------------------------------------------------------

[server]
# How many HTTP connections can be served at the same time. Each one costs a
# TCP socket and roughly 4 KB of RAM.
#
# Keep in mind that the network stack also needs sockets for DHCP, DNS and
# mDNS - the firmware sizes its socket pool as `max_connections + 4`, so you
# only need to change this number.
#
# Don't shrink this to save RAM: during a firmware update the browser holds one
# connection open for the whole upload and another one to follow the progress,
# so 1 would leave the page stuck at 0% until the upload finishes.
#
# Note too that every authenticated request costs a full PBKDF2 (see
# `users.rounds` below), and the progress poll runs while the flash is being
# erased and written - so polling harder makes an upload slower, not faster.
max_connections = 4


# ---------------------------------------------------------------------------
#  Accounts
# ---------------------------------------------------------------------------

[users]
# Salt mixed into every password before hashing. Any string works, but we suggest
# picking your own: a value shared with every other build of this project is a
# weaker one.
#
# Changing it rewrites the generated password hashes.
salt = "onani"

# PBKDF2 iteration count. Higher = harder to brute-force the stored hashes,
# but slower to log in - and with HTTP Basic Auth, every single request pays
# this cost.
#
# 5153 is a safe starting point on an ESP32-S3. Measure before raising it.
rounds = 5153 # 0x0d00 + 0x0721

# One [[users.signed]] block per login account, for example:
#
#     [[users.signed]]
#     name = "admin"
#     password = "your-password"
#
# At least one account is required - with an empty list, every login attempt
# is rejected and the control panel cannot be used.
#
# ⚠️ To add your first account, DELETE the line below and replace it with the
#    [[users.signed]] block shown above. (TOML does not allow both at once.)
#
# ⚠️ Never leave `name` or `password` empty. An empty name plus an empty
#    password is itself a *valid* credential and would let anyone in.
signed = []
