[package]
name = "ayachi-door-access"
version = "0.2.0-alpha"
edition = "2024"
authors = ["Han_feng"]

[dependencies]
# esp
esp-hal = { version = "1.2.1", features = ["esp32s3", "defmt", "unstable"] }
esp-radio = { version = "1.0.0-beta.1", features = ["esp32s3", "wifi", "defmt"] }
esp-rtos = { version = "0.4.0", features = ["esp32s3", "embassy", "esp-radio", "esp-alloc", "defmt"] }
esp-backtrace = { version = "0.20.0", features = ["esp32s3", "panic-handler", "defmt"] }
esp-println = { version = "0.18.0", features = ["esp32s3", "timestamp", "defmt-espflash"] }
esp-alloc = { version = "0.11.0", features = ["esp32s3", "global-allocator", "defmt"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "embedded-storage", "defmt"] }
esp-storage = { version = "0.10.0", features = ["esp32s3", "defmt"] }
embedded-storage = "0.3.2"

# embassy
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt"] }
embassy-net = { version = "0.9.1", features = ["dhcpv4-hostname", "tcp", "mdns", "multicast", "defmt"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-futures = { version = "0.1.2", features = ["defmt"] }

# mDNS
edge-nal = "0.7.0"
edge-nal-embassy = { version = "0.9.0", features = ["udp", "defmt"] }
edge-mdns = { version = "0.8.0", features = ["defmt"] }

# server
picoserve = { version = "0.20.0", features = ["embassy", "defmt"] }
pbkdf2 = { version = "0.13.0", default-features = false, features = ["sha2"] }

# general
defmt = "1.1.1"
base64 = { version = "0.23.1", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }

[build-dependencies]
toml = "1.1.6"
serde = { version = "1.0.229", features = ["derive"] }
pbkdf2 = { version = "0.13.0", default-features = false, features = ["sha2"] }